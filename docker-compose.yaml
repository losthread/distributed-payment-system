volumes:
  auth_postgres_data:
  wallet_postgres_data:
  transactions_postgres_data:

services:
  # kafka
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # redis
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  # Auth database
  postgres-auth:
    image: postgres:18-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./auth-service/db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Wallet database
  postgres-wallet:
    image: postgres:18-alpine
    container_name: postgres-wallet
    environment:
      POSTGRES_USER: ${WALLET_DB_USER}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD}
      POSTGRES_DB: wallet_db
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
      - ./wallet-service/db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WALLET_DB_USER} -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Transactions database
  postgres-transactions:
    image: postgres:18-alpine
    container_name: postgres-transactions
    environment:
      POSTGRES_USER: ${TRANSACTIONS_DB_USER}
      POSTGRES_PASSWORD: ${TRANSACTIONS_DB_PASSWORD}
      POSTGRES_DB: transactions_db
    volumes:
      - transactions_postgres_data:/var/lib/postgresql/data
      - ./transactions-service/db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSACTIONS_DB_USER} -d transactions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # auth service
  auth-service:
    build: ./auth-service
    ports:
      - "8000:8000"
    env_file:
      - ./auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy

  # wallet service
  wallet-service:
    build: ./wallet-service
    ports:
      - "8001:8001"
    env_file:
      - ./wallet-service/.env
    depends_on:
      postgres-wallet:
        condition: service_healthy

  # transactions service
  transactions-service:
    build: ./transactions-service
    ports:
      - "8002:8002"
    env_file:
      - ./transactions-service/.env
    depends_on:
      postgres-transactions:
        condition: service_healthy

  # API gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8006:8006"
    env_file:
      - ./api-gateway/.env
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
      wallet-service:
        condition: service_started
      transactions-service:
        condition: service_started